{{- if .Values.routerSpec.enableRouter -}}
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-router-service"
  namespace: {{ .Release.Namespace }}
  {{- if .Values.routerSpec.serviceAnnotations }}
  annotations: {{- toYaml .Values.routerSpec.serviceAnnotations | nindent 4 }}
  {{- end }}
  labels:
  {{- include "chart.routerStandardLabels" (dict "releaseName" .Release.Name "chartName" .Chart.Name) | nindent 4 }}
  {{- include "chart.routerLabels" . | nindent 4 }}
spec:
  type: {{ .Values.routerSpec.serviceType }}
  ports:
    - name: "router-sport"
      port: {{ .Values.routerSpec.servicePort }}
      targetPort: {{ .Values.routerSpec.containerPort }}
      protocol: TCP
      {{- if and (eq .Values.routerSpec.serviceType "NodePort") .Values.routerSpec.nodePort }}
      nodePort: {{ .Values.routerSpec.nodePort }}
      {{- end }}
    - name: "lmcache-port"
      port: {{ .Values.routerSpec.lmcacheControllerPort | default 9000 }}
      targetPort: lmcache-port
      protocol: TCP
    {{- if .Values.routerSpec.lmcacheControllerReplyPort }}
    - name: "lmcache-reply"
      port: {{ .Values.routerSpec.lmcacheControllerReplyPort }}
      targetPort: lmcache-reply
      protocol: TCP
    {{- end }}
    {{- if .Values.routerSpec.lmcacheControllerHeartbeatPort }}
    - name: "lmcache-hbeat"
      port: {{ .Values.routerSpec.lmcacheControllerHeartbeatPort }}
      targetPort: lmcache-hbeat
      protocol: TCP
    {{- end }}
  {{- include "chart.routerExtraPorts" $ | nindent 4 }}
  selector:
  {{- include "chart.routerStandardLabels" (dict "releaseName" .Release.Name "chartName" .Chart.Name) | nindent 4 }}
  {{- include "chart.routerLabels" . | nindent 4 }}
{{- end }}
