name: helm-unittest

on:
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/helm-unittest.yml"
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/helm-unittest.yml"

permissions:
  contents: read

jobs:
  helm-unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
      with:
        version: v3.22.0
    - name: Install helm-unittest
      run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1
    - name: Run helm unittest
      run: helm unittest helm
