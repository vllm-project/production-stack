name: CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '**.py'
      - 'pyproject.toml'
  pull_request:
    paths:
        - '.github/workflows/**'
        - '**.py'
        - 'pyproject.toml'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          # ubuntu-latest now defaults to Python 3.14, where the test extra's
          # sentencepiece 0.2.0 has no wheel and fails to build from source
          # (vllm 0.32.0 -> sentencepiece). Pin 3.12 until deps support 3.14.
          python-version: "3.12"
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Install Dependencies
        run: uv sync --all-extras --all-groups

      - name: Run Tests
        run: uv run pytest
