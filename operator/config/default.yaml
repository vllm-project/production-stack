                    - image
                    type: object
                  toleration:
                    description: Toleration
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists and Equal. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                required:
                - image
                - resources
                type: object
              lmCacheConfig:
                description: LM Cache configuration
                properties:
                  cpuOffloadingBufferSize:
                    default: 4Gi
                    description: |-
                      CPUOffloadingBufferSize is the size of the CPU offloading buffer.
                      InProcess mode only.
                    type: string
                  diskOffloadingBufferSize:
                    default: 8Gi
                    description: |-
                      DiskOffloadingBufferSize is the size of the disk offloading buffer.
                      InProcess mode only.
                    type: string
                  enabled:
                    default: false
                    description: Enabled enables LM Cache
                    type: boolean
                  mode:
                    default: Multiprocess
                    description: |-
                      Mode selects where the KV cache lives.

                      InProcess keeps the cache inside the engine process (LMCacheConnectorV1),
                      offloading to CPU memory, local disk and an optional remote backend; it
                      is configured by the cpuOffloadingBufferSize, diskOffloadingBufferSize,
                      remoteUrl and remoteSerde fields. Multiprocess hands the cache to a
                      CacheServer running `lmcache server`, reached through the
                      LMCacheMPConnector and configured by the multiprocess block.
                    enum:
                    - InProcess
                    - Multiprocess
                    type: string
                  multiprocess:
                    default: {}
                    description: |-
                      Multiprocess configures the connection to the cache server.
                      Multiprocess mode only.
                    properties:
                      extraConfig:
                        additionalProperties:
                          type: string
                        description: |-
                          ExtraConfig holds further kv_connector_extra_config entries, merged into
                          the generated config. Keys are used verbatim, so they must carry the
                          lmcache.mp. prefix where the adapter expects one. Values set here win
                          over the generated ones.
                        type: object
                      host:
                        description: |-
                          Host is the cache server address, including scheme, for example
                          tcp://cacheserver-sample.default.svc.cluster.local.
                        type: string
                      isolatedIpc:
                        description: |-
                          IsolatedIPC maps to lmcache.mp.isolated_ipc, for a worker and a server
                          that share no host IPC namespace or /dev/shm. Must match the cache
                          server's --isolated-ipc.
                        type: boolean
                      port:
                        default: 9000
                        description: Port is the cache server ZMQ port.
                        format: int32
                        type: integer
                      transferMode:
                        default: lmcache_driven
                        description: |-
                          TransferMode maps to lmcache.mp.mp_transfer_mode and must agree with the
                          cache server's --supported-transfer-mode.

                          lmcache_driven, the only supported mode, has the cache server copy KV
                          out of this engine's GPU memory over CUDA IPC.
                        enum:
                        - lmcache_driven
                        type: string
                    type: object
                  remoteSerde:
                    description: |-
                      RemoteSerde is the serialization format for the remote cache.
                      InProcess mode only.
                    type: string
                  remoteUrl:
                    description: |-
                      RemoteURL is the URL of the remote cache backend. InProcess mode only.
                      lm:// URLs need LMCache 0.5.6 or older, which still ships the server
                      they point at.
                    type: string
                type: object
              model:
                description: Model configuration
                properties:
                  chatTemplate:
                    description: Chat template
                    type: string
                  dtype:
                    description: Data type
                    type: string
                  enableLoRA:
                    description: Enable LoRA
                    type: boolean
                  enableTool:
                    description: Enable tool
                    type: boolean
                  hfTokenSecret:
                    description: HuggingFace token secret
                    properties:
                      hfTokenKeyName:
                        default: token
                        description: HuggingFace token key name in the secret
                        type: string
                      hfTokenSecretName:
                        description: HuggingFace token secret name
                        type: string
                    type: object
                  maxModelLen:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MaxModelLen is the context length, as a number or one of vLLM's
                      shorthands: "auto" (equivalently -1) derives it from the model config,
                      and suffixed forms such as "32k" or "32K" are accepted.
                    x-kubernetes-int-or-string: true
                  maxNumSeqs:
                    description: Maximum number of sequences
                    format: int32
                    type: integer
                  modelURL:
                    description: Model URL
                    type: string
                  reasoningParser:
                    description: |-
                      ReasoningParser names the parser that separates reasoning traces from
                      the answer, for example "qwen3".
                    type: string
                  toolCallParser:
                    description: Tool call parser
                    type: string
                  trustRemoteCode:
                    description: |-
                      TrustRemoteCode allows executing model code shipped in the repository.
                      Required by architectures vLLM does not implement natively.
                    type: boolean
                required:
                - modelURL
                type: object
              storageConfig:
                description: Storage configuration
                properties:
                  accessMode:
                    default: ReadWriteMany
                    description: AccessMode is the access mode for the persistent
                      volume claim
                    enum:
                    - ReadWriteOnce
                    - ReadOnlyMany
                    - ReadWriteMany
                    type: string
                  enabled:
                    default: false
                    description: Enabled enables persistent storage
                    type: boolean
                  mountPath:
                    default: /data
                    description: MountPath is the path where the volume will be mounted
                      in the container
                    type: string
                  size:
                    default: 10Gi
                    description: Size is the size of the persistent volume claim
                    type: string
                  storageClassName:
                    description: StorageClassName is the name of the storage class
                      to use
                    type: string
                  volumeName:
                    default: pvc-storage
                    description: VolumeName is the name of the volume (optional, will
                      be auto-generated if not specified)
                    type: string
                type: object
              vllmConfig:
                description: vLLM server configuration
                properties:
                  enableChunkedPrefill:
                    description: Enable chunked prefill
                    type: boolean
                  enablePrefixCaching:
                    description: Enable prefix caching
                    type: boolean
                  env:
                    description: Environment variables
                    items:
                      description: EnvVar represents an environment variable
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  extraArgs:
                    description: Extra arguments for vllm serve
                    items:
                      type: string
                    type: array
                  gpuMemoryUtilization:
                    description: GPU memory utilization
                    type: string
                  maxLoras:
                    description: Maximum number of LoRAs
                    format: int32
                    type: integer
                  maxNumBatchedTokens:
                    description: |-
                      MaxNumBatchedTokens caps the tokens in one batch. With LMCache it should
                      be sized against the cache server's chunk size, so a prefill covers whole
                      chunks.
                    format: int32
                    type: integer
                  port:
                    default: 8000
                    description: Port for vLLM server
                    format: int32
                    type: integer
                  tensorParallelSize:
                    description: Tensor parallel size
                    format: int32
                    type: integer
                  v1:
                    description: Use V1 API
                    type: boolean
                type: object
            required:
            - deploymentConfig
            - model
            - vllmConfig
            type: object
          status:
            description: VLLMRuntimeStatus defines the observed state of VLLMRuntime
            properties:
              availableReplicas:
                description: Number of pods that are ready and serving traffic
                format: int32
                type: integer
              lastUpdated:
                description: Last updated timestamp
                format: date-time
                type: string
              modelStatus:
                description: Model status
                type: string
              replicas:
                description: Current replica count (used by scale subresource)
                format: int32
                type: integer
              selector:
                description: Label selector for pods (used by scale subresource for
                  HPA AverageValue)
                type: string
              unavailableReplicas:
                description: Number of pods that are not yet available
                format: int32
                type: integer
              updatedReplicas:
                description: Number of pods running the latest pod template
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.deploymentConfig.replicas
        statusReplicasPath: .status.replicas
      status: {}
---
