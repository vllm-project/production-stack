apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: production-stack
    control-plane: controller-manager
  name: production-stack-controller-manager-metrics-service
  namespace: production-stack-system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: production-stack
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: production-stack
    app.kubernetes.io/instance: production-stack
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: production-stack
    app.kubernetes.io/part-of: production-stack
  name: production-stack-production-stack-controller-manager
  namespace: production-stack-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: manager
      app.kubernetes.io/instance: production-stack
      app.kubernetes.io/name: production-stack
  template:
    metadata:
      labels:
        app.kubernetes.io/component: manager
        app.kubernetes.io/instance: production-stack
        app.kubernetes.io/name: production-stack
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        image: lmcache/production-stack-operator:latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports: []
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: production-stack-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
