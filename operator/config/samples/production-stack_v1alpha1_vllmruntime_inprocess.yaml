apiVersion: production-stack.vllm.ai/v1alpha1
kind: VLLMRuntime
metadata:
  labels:
    app.kubernetes.io/name: production-stack
    app.kubernetes.io/managed-by: kustomize
    model: Qwen3-4B-Instruct-2507
  name: vllmruntime-inprocess-sample
spec:
  # Model configuration. The model is downloaded from Hugging Face at startup.
  model:
    modelURL: "Qwen/Qwen3-4B-Instruct-2507"
    maxModelLen: 16384
    dtype: "bfloat16"
    maxNumSeqs: 32

  # vLLM server configuration
  vllmConfig:
    enableChunkedPrefill: true
    enablePrefixCaching: true
    tensorParallelSize: 1
    gpuMemoryUtilization: "0.8"
    v1: true
    port: 8000

  # LMCache configuration: keep the KV cache inside the engine process and
  # offload it to CPU memory. No CacheServer is needed. The cache is lost when
  # the engine restarts and is not shared between replicas; use Multiprocess
  # mode (production-stack_v1alpha1_vllmruntime.yaml) for that.
  lmCacheConfig:
    enabled: true
    mode: InProcess
    # CPU offloading buffer, in GB
    cpuOffloadingBufferSize: "20"
    # Set to "" to turn off disk offloading, which otherwise defaults to 8Gi
    # on the container's ephemeral filesystem.
    diskOffloadingBufferSize: ""

  # Deployment configuration
  deploymentConfig:
    resources:
      cpu: "4"
      memory: "40Gi"
      gpu: "1"
      gpuType: "nvidia.com/gpu"
    image:
      registry: "docker.io"
      name: "lmcache/vllm-openai:v0.5.5"
      pullPolicy: "IfNotPresent"
      pullSecretName: ""
    replicas: 1
    deploymentStrategy: "Recreate"
