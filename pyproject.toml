[project]
name = "vllm-router"
dynamic = ["version"]
description = "The router for vLLM"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
# Should be the same as src/vllm_router/requirements.txt
dependencies = [
    "aiofiles==24.1.0",
    "black>=25.1.0",
    "fastapi==0.128.0",
    "aiohttp[speedups]==3.14.3",
    "kubernetes==36.0.3",
    "numpy==1.26.4",
    "prometheus-client==0.21.1",
    "python-multipart==0.0.32",
    "sentry-sdk[fastapi]==2.27.0",
    "uhashring==2.3",
    "uvicorn==0.34.0",
    "xxhash==3.5.0",
    "psutil==7.0.0",
    "pyyaml>=6.0.2",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "h11>=0.16.0",  # fix critical vulnerability GHSA-vqfr-h8mv-ghfj
    "httpcore>=1.0.8",  # required for h11>=0.16.0
]

[project.scripts]
vllm-router = "vllm_router.app:main"

[project.urls]
Repository = "https://github.com/vllm-project/production-stack"

[project.optional-dependencies]
default = []  # leave this empty because pip requires at least one specifier
semantic_cache = [
    "sentence-transformers==2.2.2",
    "faiss-cpu==1.10.0",
    "huggingface-hub==0.34.0",
]
lmcache = [
    # lmcache's controller<->worker ZMQ messages are NOT a stable protocol
    # across versions (a 0.3.x controller rejects a 0.4+/0.5+ worker's
    # RegisterMsg as an unknown type), so the router-side lmcache MUST match
    # the engines' lmcache exactly - keep this pin in lockstep with the
    # engine images you deploy. vllm is required for hash parity: kv-aware
    # chunk hashes are rooted in vLLM's NONE_HASH and hash fn, and a router
    # without the engines' vllm derives a different chain (every lookup
    # silently misses).
    "lmcache==0.5.4",
    "vllm==0.22.0",
]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "vllm==0.22.0"
]

[build-system]
requires = ["setuptools>=68", "setuptools_scm[toml]>=8.0"]

[tool.setuptools_scm]
write_to = "src/vllm_router/_version.py"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
lint = [
    "pre-commit>=4.1.0",
]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3"
]
